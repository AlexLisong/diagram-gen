<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation Story Pyramid</title>
  <style>
    body {
      margin: 0;
      background: #f4efe6;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
    }
    .frame {
      width: min(96vw, 1600px);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.16);
      border-radius: 20px;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f4efe6"/>
